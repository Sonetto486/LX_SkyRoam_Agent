<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试数据提取</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .hotel { background: #f9f0ff; border-color: #722ed1; }
        .transport { background: #e6fffb; border-color: #13c2c2; }
        .schedule { background: #f6ffed; border-color: #52c41a; }
        .meal { background: #fff7e6; border-color: #fa8c16; }
        .attraction { background: #e6f7ff; border-color: #1890ff; }
        h2 { margin-top: 0; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }
        .tag.hotel { background: #722ed1; color: white; }
        .tag.transport { background: #13c2c2; color: white; }
        .tag.schedule { background: #52c41a; color: white; }
        .tag.meal { background: #fa8c16; color: white; }
        .tag.attraction { background: #1890ff; color: white; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>旅行计划数据提取测试</h1>
        <div id="results"></div>
    </div>

    <script>
        // 模拟数据提取逻辑
        const testData = {
            hotel: {
                name: "贵阳东景希尔顿酒店",
                address: "金阳北路277号",
                rating: 4.7,
                price_per_night: 752,
                star_rating: 5,
                amenities: ["免费WiFi", "24小时前台", "空调", "健身房", "游泳池", "餐厅"]
            },
            daily_itineraries: [
                {
                    day: 1,
                    date: "2026-05-17",
                    schedule: [
                        { time: "08:00-09:00", activity: "早餐", location: "老粥楼记", cost: 35, tips: "无需预订" },
                        { time: "09:00-11:30", activity: "晨间漫步", location: "观山湖公园" },
                        { time: "12:00-13:00", activity: "午餐", location: "食府湘苑", cost: 280 }
                    ],
                    transportation: {
                        primary_routes: [
                            { type: "高铁", name: "出发地→贵阳市", duration: 320, distance: 1250, price: 680 }
                        ]
                    },
                    meals: [
                        { type: "早餐", time: "08:00-09:00", restaurant_name: "老粥楼记", cuisine: "中餐厅", estimated_cost: 35 },
                        { type: "午餐", time: "12:00-13:00", restaurant_name: "食府湘苑", cuisine: "中餐厅", estimated_cost: 280 }
                    ],
                    attractions: [
                        { name: "观山湖公园", type: "风景名胜;公园", score: 4 },
                        { name: "观山湖民族广场", type: "风景名胜;城市广场", score: 4.1 }
                    ]
                }
            ]
        };

        function extractData(planData) {
            const results = [];

            planData.daily_itineraries.forEach((day, dayIndex) => {
                const dayActivities = [];

                // 1. 提取住宿信息
                if (dayIndex === 0 && planData.hotel) {
                    dayActivities.push({
                        type: 'hotel',
                        title: planData.hotel.name,
                        data: planData.hotel
                    });
                }

                // 2. 提取交通信息
                if (day.transportation && day.transportation.primary_routes) {
                    day.transportation.primary_routes.forEach(route => {
                        dayActivities.push({
                            type: 'transport',
                            title: route.name,
                            data: route
                        });
                    });
                }

                // 3. 提取日程
                if (day.schedule) {
                    day.schedule.forEach(item => {
                        const isMeal = item.activity.includes('餐');
                        dayActivities.push({
                            type: isMeal ? 'meal' : 'schedule',
                            title: item.activity,
                            data: item
                        });
                    });
                }

                // 4. 提取景点
                if (day.attractions) {
                    day.attractions.forEach(attr => {
                        dayActivities.push({
                            type: 'attraction',
                            title: attr.name,
                            data: attr
                        });
                    });
                }

                results.push({
                    day: day.day,
                    date: day.date,
                    activities: dayActivities
                });
            });

            return results;
        }

        function renderResults(data) {
            const container = document.getElementById('results');
            let html = '';

            data.forEach(day => {
                html += `<div class="section"><h2>Day ${day.day} - ${day.date}</h2>`;

                day.activities.forEach(activity => {
                    html += `<div class="section ${activity.type}">
                        <span class="tag ${activity.type}">${activity.type}</span>
                        <strong>${activity.title}</strong>
                        <pre>${JSON.stringify(activity.data, null, 2)}</pre>
                    </div>`;
                });

                html += '</div>';
            });

            container.innerHTML = html;
        }

        // 执行测试
        const extractedData = extractData(testData);
        console.log('提取的数据:', extractedData);
        renderResults(extractedData);
    </script>
</body>
</html>
